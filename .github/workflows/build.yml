name: Build CodaLauncher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test release version consistency
        run: node tests/release-version.test.cjs
      - name: Test Settings save feedback
        run: |
          node --check web/app.js
          node tests/web/settings-save.test.cjs
          node tests/web/mod-drawer-refresh.test.cjs
      - name: Test account verification
        run: dotnet run --project tests/accounts/AccountsTests.csproj -c Release
      - name: Test official Minecraft profile registration
        run: dotnet run --project tests/official/OfficialLauncherTests.csproj -c Release
      - name: Test managed mod installation
        run: dotnet run --project tests/ManagedModsTests.csproj -c Release
      - name: Test Nightly newest-release selection
        run: dotnet run --project tests/nightly/NightlyReleaseTests.csproj -c Release
      - name: Test automatic Coda Wolf mod discovery and safe installation
        run: dotnet run --project tests/codawolf/CodaWolfReleaseTests.csproj -c Release
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/CodaLauncher
      - name: Verify compiled launcher version
        shell: pwsh
        run: |
          [xml]$project = Get-Content CodaLauncher.csproj
          $expected = [string]$project.Project.PropertyGroup.Version
          $actual = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist/CodaLauncher/CodaLauncher.exe).Path).ProductVersion -split '\+', 2)[0]
          if ($actual -ne $expected) { throw "Launcher compiled version $actual does not match project version $expected" }
      - name: Verify web payload
        shell: pwsh
        run: |
          if (!(Test-Path dist/CodaLauncher/CodaLauncher.exe)) { throw "CodaLauncher.exe missing" }
          if (!(Test-Path dist/CodaLauncher/web/index.html)) { throw "web/index.html missing" }
          if (!(Test-Path dist/CodaLauncher/web/app.js)) { throw "web/app.js missing" }
          if (!(Test-Path dist/CodaLauncher/web/assets/coda-headshot.png)) { throw "Coda headshot missing" }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/CodaLauncher/* -DestinationPath dist/CodaLauncher-win64.zip -Force
      - name: Build and test Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          ./packaging/windows/build-installer.ps1 -Version 0.7.10 -PayloadDir dist/CodaLauncher -OutputDir dist/setup
          ./packaging/windows/test-installer.ps1 -Installer dist/setup/CodaLauncher-v0.7.10-win64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CodaLauncher-build
          path: |
            dist/CodaLauncher-win64.zip
            dist/setup/*
          retention-days: 30

  portable:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test release version consistency
        run: node tests/release-version.test.cjs
      - name: Test Settings save feedback
        run: |
          node --check web/app.js
          node tests/web/settings-save.test.cjs
          node tests/web/mod-drawer-refresh.test.cjs
      - name: Test account verification
        run: dotnet run --project tests/accounts/AccountsTests.csproj -c Release
      - name: Test official Minecraft profile registration
        run: dotnet run --project tests/official/OfficialLauncherTests.csproj -c Release
      - name: Test managed mod installation
        run: dotnet run --project tests/ManagedModsTests.csproj -c Release
      - name: Test Nightly newest-release selection
        run: dotnet run --project tests/nightly/NightlyReleaseTests.csproj -c Release
      - name: Test automatic Coda Wolf mod discovery and safe installation
        run: dotnet run --project tests/codawolf/CodaWolfReleaseTests.csproj -c Release
      - name: Compile and smoke-test native desktop edition
        run: dotnet run --project Desktop/CodaLauncher.Desktop.csproj -c Release -- --smoke-test
