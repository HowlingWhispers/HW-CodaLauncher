name: Build CodaLauncher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/CodaLauncher
      - name: Verify web payload
        shell: pwsh
        run: |
          if (!(Test-Path dist/CodaLauncher/CodaLauncher.exe)) { throw "CodaLauncher.exe missing" }
          if (!(Test-Path dist/CodaLauncher/web/index.html)) { throw "web/index.html missing" }
          if (!(Test-Path dist/CodaLauncher/web/app.js)) { throw "web/app.js missing" }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/CodaLauncher/* -DestinationPath dist/CodaLauncher-v0.2.1-self-update-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CodaLauncher-build
          path: dist/CodaLauncher-v0.2.1-self-update-win64.zip
          retention-days: 30
