name: Publish CodaLauncher prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codalauncher-release
  cancel-in-progress: false

env:
  CODA_VERSION: 0.8.0
  CODA_TAG: v0.8.0

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(git rev-parse --verify "refs/tags/$CODA_TAG" 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Source-only change: existing release remains unchanged."
            exit 0
          fi
          if gh release view "$CODA_TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    timeout-minutes: 25
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: win64
          - os: ubuntu-24.04
            rid: linux-x64
            platform: linux-x64
          - os: ubuntu-24.04
            rid: linux-arm64
            platform: linux-arm64
          - os: macos-14
            rid: osx-x64
            platform: macos-x64
          - os: macos-14
            rid: osx-arm64
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test release version consistency
        run: node tests/release-version.test.cjs
      - name: Test Settings save feedback
        run: |
          node --check web/app.js
          node tests/web/settings-save.test.cjs
          node tests/web/mod-drawer-refresh.test.cjs
          node tests/web/addons-play-session.test.cjs
          node tests/web/nightly-version-panel.test.cjs
          node tests/web/concept-ui.test.cjs
      - name: Test account verification
        run: dotnet run --project tests/accounts/AccountsTests.csproj -c Release
      - name: Test official Minecraft profile registration
        run: dotnet run --project tests/official/OfficialLauncherTests.csproj -c Release
      - name: Test managed mod installation
        run: dotnet run --project tests/ManagedModsTests.csproj -c Release
      - name: Test automatic required mod updates
        run: dotnet run --project tests/officialmods/OfficialModsTests.csproj -c Release
      - name: Test verified Nightly release identification
        run: dotnet run --project tests/modshelf/ModShelfTests.csproj -c Release
      - name: Test Nightly newest-release selection
        run: dotnet run --project tests/nightly/NightlyReleaseTests.csproj -c Release
      - name: Test automatic Coda Wolf mod discovery and safe installation
        run: dotnet run --project tests/codawolf/CodaWolfReleaseTests.csproj -c Release
      - name: Publish Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet publish CodaLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/payload
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (!(Test-Path dist/payload/web/assets/coda-headshot.png)) { throw "Coda portrait missing" }
          $actual = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist/payload/CodaLauncher.exe).Path).ProductVersion -split '\+', 2)[0]
          if ($actual -ne $env:CODA_VERSION) { throw "Built launcher reports $actual, expected $env:CODA_VERSION" }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $bundle = "CodaLauncher-v$env:CODA_VERSION-win64.zip"
          Compress-Archive -Path dist/payload/* -DestinationPath "dist/release/$bundle"
          $sha = (Get-FileHash "dist/release/$bundle" -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ schema = 1; version = $env:CODA_VERSION; bundle = $bundle; sha256 = $sha } | ConvertTo-Json | Set-Content -Encoding UTF8 dist/release/launcher-update.json
      - name: Verify Windows staged update and reboot before packaging
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./tests/self-update-smoke.ps1 -PayloadDirectory dist/payload
      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          ./packaging/windows/build-installer.ps1 -Version $env:CODA_VERSION
          ./packaging/windows/test-installer.ps1 -Installer "dist/release/CodaLauncher-v$env:CODA_VERSION-win64-Setup.exe"
      - name: Publish Linux or macOS
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          dotnet run --project Desktop/CodaLauncher.Desktop.csproj -c Release -- --smoke-test
          dotnet publish Desktop/CodaLauncher.Desktop.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=false -o dist/payload
          mkdir -p dist/release
          chmod +x dist/payload/CodaLauncher
          if [[ "${{ matrix.platform }}" == linux-* ]]; then
            cp Desktop/start.sh dist/payload/start.sh
            chmod +x dist/payload/start.sh
            cp Desktop/README-LINUX.txt dist/payload/README-FIRST.txt
            tar -czf "dist/release/CodaLauncher-v$CODA_VERSION-${{ matrix.platform }}.tar.gz" -C dist/payload .
          else
            mkdir -p dist/CodaLauncher.app/Contents/MacOS dist/CodaLauncher.app/Contents/Resources
            cp -R dist/payload/. dist/CodaLauncher.app/Contents/MacOS/
            cp Desktop/Info.plist dist/CodaLauncher.app/Contents/Info.plist
            codesign --force --deep --sign - dist/CodaLauncher.app
            codesign --verify --deep --strict dist/CodaLauncher.app
            ditto -c -k --sequesterRsrc --keepParent dist/CodaLauncher.app "dist/release/CodaLauncher-v$CODA_VERSION-${{ matrix.platform }}.zip"
          fi
          python3 - <<'PY'
          import glob, hashlib, json, os
          path = next(p for p in glob.glob("dist/release/*") if p.endswith((".zip", ".tar.gz")))
          bundle = os.path.basename(path)
          sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
          with open(path + ".sha256", "w") as f: f.write(sha + "  " + bundle + "\n")
          PY
      - name: Smoke-test Linux UI
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1
          timeout 30s xvfb-run -a dist/payload/CodaLauncher --smoke-ui
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify real published Frontier automatic installation before shipping its selector
        env:
          GH_TOKEN: ${{ github.token }}
          # Must satisfy minimumLoader in HW-Mods mods/frontier-mods.json.
          HOWL_LOADER_VERSION: 0.0.46
        run: |
          set -euo pipefail
          mkdir -p runtime-check
          gh release download "v$HOWL_LOADER_VERSION" --repo HowlingWhispers/HW-CodaLoader --pattern "CodaLoader-v$HOWL_LOADER_VERSION-win64.zip" --pattern update-manifest.json --dir runtime-check
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,zipfile
          v=os.environ['HOWL_LOADER_VERSION']
          root=pathlib.Path('runtime-check');m=json.loads((root/'update-manifest.json').read_text())
          assert m['version']==v and m['bundle']==f'CodaLoader-v{v}-win64.zip'
          archive=root/m['bundle'];assert hashlib.sha256(archive.read_bytes()).hexdigest()==m['sha256']
          with zipfile.ZipFile(archive) as z: jar=z.read('CodaLoader.jar')
          assert hashlib.sha256(jar).hexdigest()==m['files']['CodaLoader.jar']
          (root/'CodaLoader.jar').write_bytes(jar)
          PYCODE
          dotnet run --project tests/officialmods/OfficialModsTests.csproj -c Release -- --published-frontier runtime-check/CodaLoader.jar
      - name: Publish all platforms together
        env:
          # Some GitHub installations deny release creation to GITHUB_TOKEN
          # despite contents: write. An optional, repository-scoped token may
          # be configured as a secret without embedding credentials in source.
          GH_TOKEN: ${{ secrets.CODALAUNCHER_RELEASE_TOKEN || github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # CodaLauncher 0.8.0 (prerelease)

          v0.8.0: Frontier look. Selecting Frontier turns the launcher into a pixel-art frontier camp:
          wooden panels, bevelled buttons, a camp scene on Home, a pixel moon and a parchment news board.
          Classic keeps its midnight look. Only the appearance changes; installs, paths and saves are untouched.
          The trust moon now notes when checksums matched; distribution is still not signed.
          Release gate verified with H.O.W.L. 0.0.46 and the published Frontier 0.3.x before publishing.

          v0.7.32: Classic / Frontier play modes. Frontier has its own worlds, mods and settings.
          Select Frontier on Home to prepare its required mod automatically through Nightly Play / Install-Repair.
          H.O.W.L. 0.0.43 and the published Frontier release are verified before this launcher is published.
          Frontier is initially available on Windows Nightly for local singleplayer.
          Classic keeps its existing paths and catalog. No existing world or mod is deleted.
          Required official mod install/update support from the HW-Mods GitHub catalog.
          Sorting Pipes is automatically maintained in Nightly after H.O.W.L. 0.0.38+ compatibility verification.
          Downloads require published SHA-256 checksums and valid Minecraft/mod identity before installation.
          Modified and duplicate manual mods are preserved. Offline reuse requires checksum-verified installed code.
          Includes Windows installer/portable builds and Linux/macOS portable builds.
          Existing launcher UI, account, worlds, saves and settings are retained.
          EOF
          if ! gh release create "$CODA_TAG" dist/release/* --target "$GITHUB_SHA" --prerelease --title "CodaLauncher $CODA_VERSION" --notes-file release-notes.md; then
            echo "::error::Release creation failed. If the workflow token is denied with HTTP 403, configure a repository secret named CODALAUNCHER_RELEASE_TOKEN with scoped Contents: read/write access, then rerun."
            exit 1
          fi
