name: Publish CodaLauncher prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        shell: pwsh
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/CodaLauncher
          Compress-Archive -Path dist/CodaLauncher/* -DestinationPath dist/CodaLauncher-v0.5.1-coda-voice-win64.zip -Force
          $sha = (Get-FileHash dist/CodaLauncher-v0.5.1-coda-voice-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          {
            "schema": 1,
            "version": "0.5.1-coda-voice",
            "bundle": "CodaLauncher-v0.5.1-coda-voice-win64.zip",
            "sha256": "$sha"
          }
          "@ | Set-Content -Encoding UTF8 dist/launcher-update.json
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.1-coda-voice"
          $zip = "dist/CodaLauncher-v0.5.1-coda-voice-win64.zip"
          @"
          # CodaLauncher v0.5.1 Coda Voice

          Installer diagnostics milestone.

          Includes:
          - INSTALL / REPAIR / PLAY primary flow
          - managed install under %APPDATA%\.howlingshispers
          - Minecraft workspace at %APPDATA%\.howlingshispers\minecraft
          - current CodaLoader release download from GitHub
          - CML Pack dependency resolution with SHA-256 verified Resourcepacks
          - CML mod scanning, news, settings and logs

          Adds the first real Packs screen with CML Base as the required foundation pack.\n\n          INSTALL/REPAIR now locks immediately in the UI and native backend so repeated clicks cannot start parallel installers. REPAIR also keeps an already-installed CodaLoader when only CML Base is missing.

          CodaLauncher downloads CML Base from HW-CodaLoader GitHub Releases first, with the launcher feed only as a fallback.

          If an automatic CodaLauncher self-update cannot finish, the launcher creates its own local News card linking to the release page, so manual-update notices do not depend on server news.

          CodaLauncher also updates itself through a SHA-256 verified staged copy of its own EXE, with no BAT helper or console window.

          Required components remain fully managed behind one player action. This release adds Coda's launcher voice, a dedicated white/cyan Coda portrait, and live Minecraft session states. While the game is open the launcher shows RUNNING and "Minecraft is running. Coda is on standby." When the session ends it distinguishes a normal close from an unexpected non-zero exit and points the player toward Logs when needed.
          "@ | Set-Content release-notes.md
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip dist/launcher-update.json --clobber
            gh release edit $tag --prerelease --title "CodaLauncher v0.5.1 Coda Voice" --notes-file release-notes.md
          } else {
            gh release create $tag $zip dist/launcher-update.json --target $env:GITHUB_SHA --prerelease --title "CodaLauncher v0.5.1 Coda Voice" --notes-file release-notes.md
          }
