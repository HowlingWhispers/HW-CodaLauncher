name: Publish CodaLauncher prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codalauncher-release
  cancel-in-progress: false

env:
  CODA_VERSION: 0.7.5
  CODA_TAG: v0.7.5

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(git rev-parse --verify "refs/tags/$CODA_TAG" 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Source-only change: existing release remains unchanged."
            exit 0
          fi
          if gh release view "$CODA_TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    timeout-minutes: 25
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: win64
          - os: ubuntu-24.04
            rid: linux-x64
            platform: linux-x64
          - os: ubuntu-24.04
            rid: linux-arm64
            platform: linux-arm64
          - os: macos-14
            rid: osx-x64
            platform: macos-x64
          - os: macos-14
            rid: osx-arm64
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test release version consistency
        run: node tests/release-version.test.cjs
      - name: Test Settings save feedback
        run: |
          node --check web/app.js
          node tests/web/settings-save.test.cjs
      - name: Test account verification
        run: dotnet run --project tests/accounts/AccountsTests.csproj -c Release
      - name: Test official Minecraft profile registration
        run: dotnet run --project tests/official/OfficialLauncherTests.csproj -c Release
      - name: Test managed mod installation
        run: dotnet run --project tests/ManagedModsTests.csproj -c Release
      - name: Publish Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet publish CodaLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/payload
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (!(Test-Path dist/payload/web/assets/coda-headshot.png)) { throw "Coda portrait missing" }
          $actual = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist/payload/CodaLauncher.exe).Path).ProductVersion -split '\+', 2)[0]
          if ($actual -ne $env:CODA_VERSION) { throw "Built launcher reports $actual, expected $env:CODA_VERSION" }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $bundle = "CodaLauncher-v$env:CODA_VERSION-win64.zip"
          Compress-Archive -Path dist/payload/* -DestinationPath "dist/release/$bundle"
          $sha = (Get-FileHash "dist/release/$bundle" -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ schema = 1; version = $env:CODA_VERSION; bundle = $bundle; sha256 = $sha } | ConvertTo-Json | Set-Content -Encoding UTF8 dist/release/launcher-update.json
      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          ./packaging/windows/build-installer.ps1 -Version $env:CODA_VERSION
          ./packaging/windows/test-installer.ps1 -Installer "dist/release/CodaLauncher-v$env:CODA_VERSION-win64-Setup.exe"
      - name: Publish Linux or macOS
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          dotnet run --project Desktop/CodaLauncher.Desktop.csproj -c Release -- --smoke-test
          dotnet publish Desktop/CodaLauncher.Desktop.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=false -o dist/payload
          mkdir -p dist/release
          chmod +x dist/payload/CodaLauncher
          if [[ "${{ matrix.platform }}" == linux-* ]]; then
            cp Desktop/start.sh dist/payload/start.sh
            chmod +x dist/payload/start.sh
            cp Desktop/README-LINUX.txt dist/payload/README-FIRST.txt
            tar -czf "dist/release/CodaLauncher-v$CODA_VERSION-${{ matrix.platform }}.tar.gz" -C dist/payload .
          else
            mkdir -p dist/CodaLauncher.app/Contents/MacOS dist/CodaLauncher.app/Contents/Resources
            cp -R dist/payload/. dist/CodaLauncher.app/Contents/MacOS/
            cp Desktop/Info.plist dist/CodaLauncher.app/Contents/Info.plist
            codesign --force --deep --sign - dist/CodaLauncher.app
            codesign --verify --deep --strict dist/CodaLauncher.app
            ditto -c -k --sequesterRsrc --keepParent dist/CodaLauncher.app "dist/release/CodaLauncher-v$CODA_VERSION-${{ matrix.platform }}.zip"
          fi
          python3 - <<'PY'
          import glob, hashlib, json, os
          path = next(p for p in glob.glob("dist/release/*") if p.endswith((".zip", ".tar.gz")))
          bundle = os.path.basename(path)
          sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
          with open(path + ".sha256", "w") as f: f.write(sha + "  " + bundle + "\n")
          PY
      - name: Smoke-test Linux UI
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1
          timeout 30s xvfb-run -a dist/payload/CodaLauncher --smoke-ui
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # CodaLauncher 0.7.4 (prerelease)

          Fixes the Windows reboot loop: 0.7.3 reported itself as 0.7.2 after
          a successful update. Windows and portable launcher versions now come
          from build metadata. CI checks release and binary version alignment.

          Previous H.O.W.L. branding and player features remain included.

          - H.O.W.L. means Howling Open Works Loader. Home, mod shelf, profile
            labels and both desktop editions now use the chosen name.
          - The official Minecraft installation is renamed in place to
            Howling Whispers | H.O.W.L. Existing profile/version identifiers,
            game directories, worlds and custom JVM settings are preserved.
          - Migration recognizes the legacy CodaLoader profile even when the
            official launcher removes its custom ownership marker.
          - Existing CML pack/resource IDs, assets, hashes and update filenames
            remain compatible with older installations and launcher feeds.
          - Loader update confirmation remains visible beside installed/latest
            versions. Copy All Logs and the Local Test Mode switch remain available.
          - Windows Settings save feedback is retained. Linux/macOS now display
            save success or failure beside the Save button as well.
          - Tests cover old/new profile names, repeat registration, preserved
            JVM settings, unrelated-profile protection and Settings feedback.

          Official Minecraft Launcher integration and optional Local Test Mode.

          - Default PLAY prepares an isolated Howling Whispers installation for
            the official Minecraft Launcher instead of requiring Azure app
            registration or reading Minecraft account tokens.
          - The official launcher handles Microsoft account sign-in and game
            ownership. Players select the H.O.W.L. installation and press Play.
          - Settings has a Local Test Mode switch for direct singleplayer
            development with the original local CodaPlayer identity. This mode
            does not authorize online Howling Whispers services.
          - Minecraft installations and worlds are kept separate; existing
            launcher profiles are preserved and backed up before registration.
          - Mojang version metadata is verified before the CodaLoader Java
            agent is added. The JVM receives the CML Base resource location.
          - Legacy local-only handoff with published CodaLoader 0.0.24 is
            supported while the separate loader update is prepared.
          - Windows Setup.exe, desktop/Start Menu shortcuts, Linux and macOS
            packages remain available.
          - Cross-platform tests cover profile isolation, Java-agent arguments,
            repeat updates and preservation of other Minecraft installations.
          - Real-device verification with Minecraft 26.4 Snapshot 3 remains
            required. This is an early-access prerelease.
          EOF
          gh release create "$CODA_TAG" dist/release/* --target "$GITHUB_SHA" --prerelease --title "CodaLauncher 0.7.4" --notes-file release-notes.md
