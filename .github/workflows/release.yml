name: Publish CodaLauncher prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        shell: pwsh
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/CodaLauncher
          Compress-Archive -Path dist/CodaLauncher/* -DestinationPath dist/CodaLauncher-v0.2.1-self-update-win64.zip -Force
          $sha = (Get-FileHash dist/CodaLauncher-v0.2.1-self-update-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          {
            "schema": 1,
            "version": "0.2.1-self-update",
            "bundle": "CodaLauncher-v0.2.1-self-update-win64.zip",
            "sha256": "$sha"
          }
          "@ | Set-Content -Encoding UTF8 dist/launcher-update.json
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.1-self-update"
          $zip = "dist/CodaLauncher-v0.2.1-self-update-win64.zip"
          @"
          # CodaLauncher v0.2.1 Self Update

          First installer-capable CodaLauncher milestone.

          Includes:
          - INSTALL / REPAIR / PLAY primary flow
          - managed install under %APPDATA%\.howlingshispers
          - Minecraft workspace at %APPDATA%\.howlingshispers\minecraft
          - current CodaLoader release download from GitHub
          - mandatory CML base-pack download and SHA-256 verification from launcher feed
          - CML mod scanning, news, settings and logs

          CodaLauncher now also updates itself through a SHA-256 verified staged copy of its own EXE, with no BAT helper or console window.

          CML identity, Discord linking, Minecraft ownership verification, RAM/runtime controls and avatar editing are placeholders for later milestones.
          "@ | Set-Content release-notes.md
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip dist/launcher-update.json --clobber
            gh release edit $tag --prerelease --title "CodaLauncher v0.2.1 Self Update" --notes-file release-notes.md
          } else {
            gh release create $tag $zip dist/launcher-update.json --target $env:GITHUB_SHA --prerelease --title "CodaLauncher v0.2.1 Self Update" --notes-file release-notes.md
          }
