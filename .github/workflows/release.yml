name: Publish CodaLauncher prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codalauncher-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      CODA_VERSION: 0.5.5-coda-portrait
      CODA_TAG: v0.5.5-coda-portrait
      CODA_ZIP: CodaLauncher-v0.5.5-coda-portrait-win64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check immutable release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = git rev-parse --verify "refs/tags/$env:CODA_TAG" 2>$null
          if ($existing -and $existing -ne $env:GITHUB_SHA) {
            throw "Version $env:CODA_TAG already belongs to another commit. Bump the release version instead of replacing it."
          }
          gh release view $env:CODA_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-dotnet@v4
        if: steps.release.outputs.publish == 'true'
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet restore
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/CodaLauncher
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (!(Test-Path dist/CodaLauncher/CodaLauncher.exe)) { throw "CodaLauncher.exe missing" }
          if (!(Test-Path dist/CodaLauncher/web/assets/coda-headshot.png)) { throw "Coda headshot missing" }
          Compress-Archive -Path dist/CodaLauncher/* -DestinationPath "dist/$env:CODA_ZIP"
          $sha = (Get-FileHash "dist/$env:CODA_ZIP" -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            schema = 1
            version = $env:CODA_VERSION
            bundle = $env:CODA_ZIP
            sha256 = $sha
          } | ConvertTo-Json | Set-Content -Encoding UTF8 dist/launcher-update.json
      - name: Publish prerelease
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          # CodaLauncher v0.5.5 Approved Coda Portrait

          Uses the existing approved Coda portrait on Home and the current Profile placeholder, replacing the incorrect portrait in 0.5.4.

          - Original uploaded artwork preserved byte-for-byte.
          - Transparent portrait shown in full, including ears and clipboard.
          - Background update checks while the launcher is open, with an UPDATE AVAILABLE banner and UPDATE LAUNCHER button.
          - Updates use Coda's existing terminal and wait for REBOOT CODALAUNCHER.
          - Runtime version aligned with the package to prevent repeated update prompts.
          - Portrait bundled locally, so it works offline.
          - Existing update terminal downloads, verifies and stages this release, then waits for REBOOT CODALAUNCHER.
          - Release tags and assets are immutable and point to the commit used for the build.
          "@ | Set-Content release-notes.md

          gh release create $env:CODA_TAG "dist/$env:CODA_ZIP" dist/launcher-update.json --target $env:GITHUB_SHA --prerelease --title "CodaLauncher v0.5.5 Approved Coda Portrait" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
